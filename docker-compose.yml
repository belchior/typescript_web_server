services:
  server:
    image: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: server
    depends_on:
      - database_seed
    env_file:
      - ./.env
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      - mynetwork
    volumes:
      - ./server/jest.config.ts:/usr/app/jest.config.ts:ro
      - ./server/package.json:/usr/app/package.json:ro
      - ./server/src:/usr/app/src
      - ./server/tests:/usr/app/tests
      - ./server/tsconfig.json:/usr/app/tsconfig.json:ro
    restart: always

  database:
    image: postgres:18
    container_name: database
    env_file:
      - ./.env
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - mynetwork
    restart: always

  database_schema:
    image: postgres:18
    container_name: database_schema
    command: scripts/database_schema.sh
    env_file: 
      - ./.env
    depends_on:
      - database
    networks:
      - mynetwork
    volumes:
      - ./server/scripts:/scripts:ro

  database_seed:
    image: postgres:18
    container_name: database_seed
    command: scripts/database_seed.sh
    env_file: 
      - ./.env
    depends_on:
      - database_schema
    networks:
      - mynetwork
    volumes:
      - ./server/scripts:/scripts:ro

  client:
    image: client
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: client
    env_file: 
      - ./.env
    ports:
      - ${CLIENT_PORT}:${CLIENT_PORT}
    networks:
      - mynetwork
    volumes:
      - ./client/index.html:/usr/app/index.html:ro
      - ./client/package-lock.json:/usr/app/package-lock.json:ro
      - ./client/package.json:/usr/app/package.json:ro
      - ./client/public:/usr/app/public:ro
      - ./client/relay.config.json:/usr/app/relay.config.json:ro
      - ./client/schema.graphql:/usr/app/schema.graphql:ro
      - ./client/src:/usr/app/src
      - ./client/tsconfig.app.json:/usr/app/tsconfig.app.json:ro
      - ./client/tsconfig.json:/usr/app/tsconfig.json:ro
      - ./client/tsconfig.node.json:/usr/app/tsconfig.node.json:ro
      - ./client/vite.config.ts:/usr/app/vite.config.ts:ro
    restart: always

networks:
  mynetwork:
    driver: bridge